# Local "on-prem" ZPR env: node1 + vs + web1, one image, static IPs.
# Bring up via local-compute/deploy-docker.sh (it renders configs into
# local-compute/conf/<name>/ first, then `docker compose up -d`).
services:
  node1:
    image: zpr-multinode
    platform: linux/amd64
    container_name: node1
    command: ["/bin/sh", "/entrypoint.sh"]
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun"]
    privileged: true
    volumes:
      - ./local-compute/entrypoint-node1.sh:/entrypoint.sh:ro
      - ./local-compute/conf/node1:/conf
      - ./local-compute/logs:/logs
    networks:
      zpr-local:
        ipv4_address: 172.30.0.10

  alice:
    image: zpr-multinode
    platform: linux/amd64
    container_name: alice
    command: ["/bin/sh", "/entrypoint.sh"]
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun"]
    privileged: true
    volumes:
      - ./local-compute/entrypoint-alice.sh:/entrypoint.sh:ro
      - ./local-compute/conf/alice:/conf
      - ./local-compute/logs:/logs
    networks:
      zpr-local:
        ipv4_address: 172.30.0.15
  node0:
    image: zpr-multinode
    platform: linux/amd64
    container_name: node0
    command: ["/bin/sh", "/entrypoint.sh"]
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun"]
    privileged: true
    volumes:
      - ./local-compute/entrypoint-node0.sh:/entrypoint.sh:ro
      - ./local-compute/conf/node0:/conf
      - ./local-compute/logs:/logs
    networks:
      zpr-local:
        ipv4_address: 172.30.0.13

  vs:
    image: zpr-multinode
    platform: linux/amd64
    container_name: vs
    command: ["/bin/sh", "/entrypoint.sh"]
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun"]
    privileged: true
    volumes:
      - ./local-compute/entrypoint-vs.sh:/entrypoint.sh:ro
      - ./local-compute/conf/vs:/conf
      - ./local-compute/logs:/logs
    ports:
      - "127.0.0.1:8185:8183/tcp"
    networks:
      zpr-local:
        ipv4_address: 172.30.0.11

  web1:
    image: zpr-multinode
    platform: linux/amd64
    container_name: web1
    command: ["/bin/sh", "/entrypoint.sh"]
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun"]
    privileged: true
    volumes:
      - ./local-compute/entrypoint-web1.sh:/entrypoint.sh:ro
      - ./local-compute/conf/web1:/conf
      - ./local-compute/logs:/logs
      # The docroot is container-local: entrypoint-web1.sh runs regen-banner.sh
      # into it continuously, and a bind mount would churn a repo file 5x/sec.
      # tools/ is mounted (not baked in) so the banner script stays editable
      # without an image rebuild.
      - ./tools:/tools:ro
    networks:
      zpr-local:
        ipv4_address: 172.30.0.12

  web0:
    image: zpr-multinode
    platform: linux/amd64
    container_name: web0
    command: ["/bin/sh", "/entrypoint.sh"]
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun"]
    privileged: true
    volumes:
      - ./local-compute/entrypoint-web0.sh:/entrypoint.sh:ro
      - ./local-compute/conf/web0:/conf
      - ./local-compute/logs:/logs
      - ./tools:/tools:ro
    networks:
      zpr-local:
        ipv4_address: 172.30.0.14

networks:
  zpr-local:
    name: zpr-local
    ipam:
      config:
        - subnet: 172.30.0.0/24
