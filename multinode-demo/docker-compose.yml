# Local "on-prem" ZPR env: node1 + vs + web1, one image, static IPs.
# Bring up via local-compute/deploy-docker.sh (it renders configs into the
# selected organization runtime directory before `docker compose up -d`).
services:
  node1:
    profiles: ["legacy"]
    image: zpr-multinode
    platform: linux/amd64
    container_name: ${ZPR_CONTAINER_PREFIX:-}node1
    command: ["/bin/sh", "/entrypoint.sh"]
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun"]
    privileged: true
    volumes:
      - ./local-compute/entrypoint-node1.sh:/entrypoint.sh:ro
      - ${ZPR_RUNTIME_ROOT:-./local-compute}/conf/node1:/conf
      - ${ZPR_RUNTIME_ROOT:-./local-compute}/logs:/logs
    networks:
      zpr-local:
        ipv4_address: 172.30.0.10

  alice:
    image: zpr-multinode
    platform: linux/amd64
    container_name: ${ZPR_CONTAINER_PREFIX:-}alice
    command: ["/bin/sh", "/entrypoint.sh"]
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun"]
    privileged: true
    volumes:
      - ./local-compute/entrypoint-alice.sh:/entrypoint.sh:ro
      - ${ZPR_RUNTIME_ROOT:-./local-compute}/conf/alice:/conf
      - ${ZPR_RUNTIME_ROOT:-./local-compute}/logs:/logs
    networks:
      zpr-local:
        ipv4_address: 172.30.0.15
  node0:
    profiles: ["legacy"]
    image: zpr-multinode
    platform: linux/amd64
    container_name: ${ZPR_CONTAINER_PREFIX:-}node0
    command: ["/bin/sh", "/entrypoint.sh"]
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun"]
    privileged: true
    volumes:
      - ./local-compute/entrypoint-node0.sh:/entrypoint.sh:ro
      - ${ZPR_RUNTIME_ROOT:-./local-compute}/conf/node0:/conf
      - ${ZPR_RUNTIME_ROOT:-./local-compute}/logs:/logs
    networks:
      zpr-local:
        ipv4_address: 172.30.0.13

  vs:
    image: zpr-multinode
    platform: linux/amd64
    container_name: ${ZPR_CONTAINER_PREFIX:-}vs
    command: ["/bin/sh", "/entrypoint.sh"]
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun"]
    privileged: true
    volumes:
      - ./local-compute/entrypoint-vs.sh:/entrypoint.sh:ro
      - ${ZPR_RUNTIME_ROOT:-./local-compute}/conf/vs:/conf
      - ${ZPR_RUNTIME_ROOT:-./local-compute}/state/redis:/state
      - ${ZPR_RUNTIME_ROOT:-./local-compute}/logs:/logs
    ports:
      - "127.0.0.1:8185:8183/tcp"
    networks:
      zpr-local:
        ipv4_address: 172.30.0.11

  directory:
    image: zpr-multinode-directory
    platform: linux/amd64
    profiles: ["organization"]
    container_name: ${ZPR_CONTAINER_PREFIX:-}directory
    volumes:
      - ${ZPR_RUNTIME_ROOT:?ZPR_RUNTIME_ROOT must be set}/directory:/runtime
      - ${ZPR_TRUSTED_SERVICE_BINARY:?ZPR_TRUSTED_SERVICE_BINARY must be set}:/app/bin/zpr-trusted-service:ro
    environment:
      ZPR_DIRECTORY_BASE_DN: ${ZPR_DIRECTORY_BASE_DN:-}
      ZPR_DIRECTORY_IDENTITY_MAPPINGS: ${ZPR_DIRECTORY_IDENTITY_MAPPINGS:-}
      ZPR_DIRECTORY_ATTRIBUTES: ${ZPR_DIRECTORY_ATTRIBUTES:-}
    networks:
      zpr-local:
        ipv4_address: 172.30.0.16

  directory-manager:
    image: zpr-multinode-directory-manager
    platform: linux/amd64
    profiles: ["directory-manager"]
    container_name: ${ZPR_CONTAINER_PREFIX:-}directory-manager
    environment:
      ZPR_DIRECTORY_BASE_DN: ${ZPR_DIRECTORY_BASE_DN:-}
    volumes:
      - ${ZPR_RUNTIME_ROOT:?ZPR_RUNTIME_ROOT must be set}/directory/ca.crt:/directory-ca.crt:ro
    ports:
      - "127.0.0.1::8080"
    networks:
      zpr-local: {}

  web1:
    image: zpr-multinode
    platform: linux/amd64
    container_name: ${ZPR_CONTAINER_PREFIX:-}web1
    command: ["/bin/sh", "/entrypoint.sh"]
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun"]
    privileged: true
    volumes:
      - ./local-compute/entrypoint-web1.sh:/entrypoint.sh:ro
      - ${ZPR_RUNTIME_ROOT:-./local-compute}/conf/web1:/conf
      - ${ZPR_RUNTIME_ROOT:-./local-compute}/logs:/logs
      # The docroot is container-local: entrypoint-web1.sh runs regen-banner.sh
      # into it continuously, and a bind mount would churn a repo file 5x/sec.
      # tools/ is mounted (not baked in) so the banner script stays editable
      # without an image rebuild.
      - ./tools:/tools:ro
    networks:
      zpr-local:
        ipv4_address: 172.30.0.12

  web0:
    image: zpr-multinode
    platform: linux/amd64
    container_name: ${ZPR_CONTAINER_PREFIX:-}web0
    command: ["/bin/sh", "/entrypoint.sh"]
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun"]
    privileged: true
    volumes:
      - ./local-compute/entrypoint-web0.sh:/entrypoint.sh:ro
      - ${ZPR_RUNTIME_ROOT:-./local-compute}/conf/web0:/conf
      - ${ZPR_RUNTIME_ROOT:-./local-compute}/logs:/logs
      - ./tools:/tools:ro
    networks:
      zpr-local:
        ipv4_address: 172.30.0.14

  internet-gateway:
    profiles: ["web-gateway"]
    image: zpr-multinode
    platform: linux/amd64
    container_name: ${ZPR_CONTAINER_PREFIX:-}internet-gateway
    command: ["/bin/sh", "/entrypoint.sh"]
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun"]
    privileged: true
    environment:
      ZPR_GATEWAY_ALLOWED_HOSTS: ${ZPR_GATEWAY_ALLOWED_HOSTS:-}
      ZPR_GATEWAY_NODE_ADDRESS: ${ZPR_GATEWAY_NODE_ADDRESS:-}
    volumes:
      - ./local-compute/entrypoint-internet-gateway.sh:/entrypoint.sh:ro
      - ${ZPR_RUNTIME_ROOT:?ZPR_RUNTIME_ROOT must be set}/conf/internet-gateway:/conf:ro
      - ${ZPR_RUNTIME_ROOT:?ZPR_RUNTIME_ROOT must be set}/logs:/logs
    networks:
      zpr-local: {}

networks:
  zpr-local:
    name: ${ZPR_NETWORK_NAME:-zpr-local}
    ipam:
      config:
        - subnet: 172.30.0.0/24
